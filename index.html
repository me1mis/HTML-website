<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For a wonderful teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#faf6f1;--bg2:#f0e6d8;--ink:#5a3c28;--soft:#8b6f4e;--line:#e8d5c0;--card:rgba(255,255,255,.92);--paper:#fffdf8;--btn1:#d4a8a0;--btn2:#c9958a;--gold:#c4a882;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a211c;--bg2:#1d1613;--ink:#f1e2d2;--soft:#d3b995;--line:#5a4636;--card:rgba(52,40,33,.92);--paper:#3a2d25}}
:root[data-theme="dark"]{--bg1:#2a211c;--bg2:#1d1613;--ink:#f1e2d2;--soft:#d3b995;--line:#5a4636;--card:rgba(52,40,33,.92);--paper:#3a2d25}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));font-family:'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0}
.fl{position:absolute;opacity:0;animation:up linear infinite}
@keyframes up{0%{transform:translateY(100vh) scale(.5);opacity:0}10%{opacity:.7}90%{opacity:.4}100%{transform:translateY(-10vh) scale(1.2);opacity:0}}
.pt{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(212,175,140,.5),transparent);animation:up linear infinite}
.stage{position:relative;z-index:10;width:min(340px,92vw);display:flex;flex-direction:column;align-items:center}
.scene{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:480px;width:100%;transition:opacity .5s}
@keyframes cin{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.q{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-style:italic;color:var(--ink);line-height:1.3;margin-bottom:24px;text-align:center}
.hint{font-size:.8rem;color:var(--gold);font-style:italic;text-align:center}
.btn{display:block;width:100%;padding:14px 20px;border:none;border-radius:50px;font:700 1rem 'Nunito',sans-serif;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 4px 15px rgba(212,168,160,.4);transition:transform .15s}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.97)}
.no{padding:12px 28px;background:rgba(232,213,192,.4);color:var(--soft);border:2px solid var(--line);border-radius:50px;font:600 .95rem 'Nunito',sans-serif;cursor:pointer;white-space:nowrap}
.nozone{height:56px;position:relative;width:100%;margin-top:10px;display:flex;justify-content:center}
.nudge{margin-top:16px;font:italic 1rem 'Cormorant Garamond',serif;color:var(--ink);min-height:2.5em;text-align:center;opacity:0;transition:opacity .6s}
.nudge.show{opacity:1}
/* candle */
.candle{position:relative;cursor:pointer;animation:float 3s ease-in-out infinite;margin-top:70px}
@keyframes float{50%{transform:translateY(-8px)}}
.body{width:50px;height:160px;background:linear-gradient(180deg,#fff9f0,#f5e6d0 40%,#e8d0b8 80%,#d4b896);border-radius:6px 6px 4px 4px;position:relative;box-shadow:0 0 30px rgba(212,175,140,.3);transition:height 2.2s cubic-bezier(.4,0,.6,1)}
.wick{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:3px;height:14px;background:#444;border-radius:2px}
.flame{position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:28px;height:60px;display:flex;align-items:flex-end;justify-content:center;animation:fw 1.8s ease-in-out infinite}
@keyframes fw{0%,100%{transform:translateX(-50%) rotate(-1deg)}50%{transform:translateX(-50%) rotate(2deg)}}
.fo{width:22px;height:52px;background:radial-gradient(ellipse at 50% 80%,#e8a87c,#d4a574 40%,transparent 80%);border-radius:50% 50% 40% 40%/60% 60% 40% 40%;animation:fo 1.2s ease-in-out infinite alternate;position:relative}
@keyframes fo{from{transform:scaleX(.9)}to{transform:scaleX(1.1) scaleY(.95)}}
.fi{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:12px;height:30px;background:radial-gradient(ellipse at 50% 80%,#fff9f0,#f5e6d0 50%,transparent 85%);border-radius:50% 50% 40% 40%/60% 60% 40% 40%}
.glow{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:70px;height:70px;background:radial-gradient(circle,rgba(212,175,140,.45),transparent 70%);border-radius:50%;animation:gp 1.5s ease-in-out infinite alternate}
@keyframes gp{from{opacity:.5}to{opacity:1;transform:translateX(-50%) scale(1.2)}}
.melting .body{height:0}.melting .flame,.melting .wick{opacity:0;transition:opacity .5s}
.chint{margin-top:34px;font:italic 1.3rem 'Cormorant Garamond',serif;color:var(--ink);text-align:center;animation:hp 2s ease-in-out infinite alternate}
@keyframes hp{from{opacity:.6}to{opacity:1}}
.portal{position:fixed;inset:0;background:radial-gradient(ellipse,#d4c4b0,#b8a890);opacity:0;pointer-events:none;z-index:20;transition:opacity .8s;display:flex;align-items:center;justify-content:center}
.portal.on{opacity:1;pointer-events:all}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.4);animation:rg 1.8s ease-out forwards}
@keyframes rg{from{width:10px;height:10px;opacity:1}to{width:600px;height:600px;opacity:0}}
.ring:nth-child(2){animation-delay:.3s}.ring:nth-child(3){animation-delay:.6s}
.big{font-size:5rem;animation:float 3s ease-in-out infinite;margin-bottom:12px}
/* envelope */
.env{cursor:pointer;width:140px;transition:transform .3s}.env:hover{transform:scale(1.08) rotate(-2deg)}
.eb{width:140px;height:92px;background:linear-gradient(160deg,#fff9f0,#f5ebe0);border-radius:4px 4px 8px 8px;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.12);perspective:300px}
.ef{position:absolute;top:0;left:0;border-left:70px solid transparent;border-right:70px solid transparent;border-top:46px solid var(--line);transform-origin:top;transition:transform .5s}
.ef.open{transform:rotateX(180deg)}
.eh{position:absolute;top:50%;left:50%;transform:translate(-50%,-20%);font-size:1.5rem}
/* cards */
.card{background:var(--paper);border-radius:16px;padding:28px 24px;width:100%;box-shadow:0 20px 60px rgba(180,140,110,.25),0 4px 20px rgba(0,0,0,.12);position:relative;animation:cin .7s cubic-bezier(.34,1.56,.64,1) both;max-height:86vh;overflow:auto}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#c4a882,#e8c4a8);border-radius:16px 16px 0 0}
.lt{font:italic 1.1rem/1.65 'Cormorant Garamond',serif;color:var(--ink);font-weight:600}
.sign{display:block;margin-top:14px;text-align:right;font:600 1rem 'Cormorant Garamond',serif;color:var(--soft)}
.card .btn{margin-top:18px;background:linear-gradient(135deg,#c4a882,#d4b896)}
.title{font:italic 1.5rem 'Cormorant Garamond',serif;color:var(--ink);text-align:center;margin-bottom:6px}
.sub{font-size:.85rem;color:var(--soft);text-align:center;margin-bottom:18px}
.wish{display:flex;align-items:center;gap:14px;border:1.5px solid rgba(196,168,130,.3);background:rgba(196,168,130,.08);border-radius:14px;padding:12px 16px;margin-bottom:10px;color:var(--ink)}
.wish i{font-style:normal;font-size:1.5rem}.wish b{display:block;font-size:.95rem}.wish span{font-size:.78rem;color:var(--soft)}
.ph{width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid var(--line);box-shadow:0 6px 24px rgba(196,168,130,.4);margin-bottom:14px}
.conf{position:fixed;pointer-events:none;font-size:1.4rem;animation:cd 1.8s ease-in both;z-index:100}
@keyframes cd{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="portal" id="portal"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>

<div class="stage">
  <!-- 1: свеча -->
  <div class="scene" id="s1" style="display:flex">
    <div class="candle" id="candle">
      <div class="flame"><div class="glow"></div><div class="fo"><div class="fi"></div></div></div>
      <div class="body"><div class="wick"></div></div>
    </div>
    <div class="chint">We lit this candle<br>of knowledge for you... 🕯️</div>
    <div class="hint" style="margin-top:10px">tap the candle</div>
  </div>

  <!-- 2: вопрос -->
  <div class="scene" id="s2">
    <img class="ph big" id="ph1" alt="">
    <div class="q" id="q2"></div>
    <div class="hint" style="margin-bottom:28px">the candle has melted, but the warmth remains...</div>
    <button class="btn" id="yes">Of course ✨</button>
    <div class="nozone"><button class="no" id="no">No</button></div>
    <div class="nudge" id="nudge"></div>
  </div>

  <!-- 3: конверт -->
  <div class="scene" id="s3">
    <div class="q">Look what<br>we prepared for you... ✨</div>
    <div class="env" id="env"><div class="eb"><div class="ef" id="flap"></div><div class="eh">💌</div></div></div>
    <div class="hint" style="margin-top:26px;font-size:1.1rem;font-family:'Cormorant Garamond',serif">tap to open</div>
  </div>

  <!-- 4: письмо -->
  <div class="scene" id="s4">
    <div class="card">
      <img class="ph" id="ph2" alt="" style="display:block;margin:0 auto 16px;width:112px;height:112px"><div class="lt" id="letter"></div>
      <div class="sign" id="sign"></div>
      <button class="btn" id="flip">Flip the letter ✨</button>
    </div>
  </div>

  <!-- 5: пожелания -->
  <div class="scene" id="s5">
    <div class="card">
      <div class="title">Our wishes for you 💕</div>
      <div class="sub">from the heart, just for you</div>
      <div id="wishes"></div>
      <button class="btn" id="thx">Say thank you 💛</button>
    </div>
  </div>
</div>

<script>
// ══ ИЗМЕНИТЕ ЗДЕСЬ ══
const CFG = {
  teacher: "Nourchen Moumni",
  from: "Munisa & Jasmina",
  question: "Ready for a<br>little surprise?",
  letter: [
    "Dear {name}! 🌙",
    "Thank you for your knowledge, your patience and for believing in us, even when we did not believe in ourselves. 📚",
    "You do not just teach a subject. You teach us to think, to dream and never to give up. ✨",
    "May the warmth you give us every day come back to you a hundredfold. 🍎"
  ],
  wishes: [
    ["🌿","Health","and strength for all your ideas"],
    ["💡","Inspiration","so every lesson feels like a celebration"],
    ["🌸","Grateful students","who value and remember you"]
  ]
};

// фон
const bg = $('bg'), em = ['💋','😘','❤️','😍','😊','😻','💕','💗'];
function spawn() {
  const h = document.createElement('span'), d = 4000 + Math.random() * 3000;
  h.className = 'fl'; h.textContent = em[Math.random() * em.length | 0];
  h.style.cssText = `left:${Math.random() * 94}vw;font-size:${.7 + Math.random() * .8}rem;animation-duration:${d}ms`;
  bg.appendChild(h); setTimeout(() => h.remove(), d + 100);
  const p = document.createElement('div'), s = 4 + Math.random() * 14, pd = 5 + Math.random() * 4;
  p.className = 'pt'; p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;animation-duration:${pd}s`;
  bg.appendChild(p); setTimeout(() => p.remove(), pd * 1000);
}
for (let i = 0; i < 8; i++) setTimeout(spawn, i * 350);
setInterval(spawn, 700);

// сцены
const ids = ['s1','s2','s3','s4','s5'];
function show(id) {
  ids.forEach(i => $(i).style.display = 'none');
  const t = $(id); t.style.display = 'flex'; t.style.opacity = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => t.style.opacity = 1));
}

  if (melted) return; melted = true;
  $('candle').classList.add('melting');
  setTimeout(() => $('portal').classList.add('on'), 1800);
  setTimeout(() => { $('portal').classList.remove('on'); show('s2'); }, 3200);
};

// кнопка «Нет» убегает
const nudges = ['It is not scary... almost 🌸','The candle is waiting for you there ✨','We tried so hard, really 🕯️','Come on, be brave... 🌙'];
let n = 0;
function escape() {
  const b = $('no'), z = b.parentElement.getBoundingClientRect();
  b.style.position = 'absolute'; b.style.transition = 'all .3s ease';
  b.style.left = Math.random() * Math.max(0, z.width - b.offsetWidth) + 'px';
  b.style.top = (Math.random() * 90 - 20) + 'px';
}
$('no').addEventListener('mouseenter', escape);
$('no').addEventListener('touchstart', escape, {passive: true});
$('no').onclick = () => {
  const m = $('nudge'); m.textContent = nudges[n % nudges.length]; m.classList.add('show'); n++;
  if (n >= 3) setTimeout(() => { m.textContent = 'We knew you would say yes... 🌙✨'; setTimeout(() => show('s3'), 1200); }, 800);
};
$('yes').onclick = () => show('s3');

// конверт
let opened = false;
$('env').onclick = () => {
  if (opened) return; opened = true;
  const w = $('env'); w.style.transition = 'transform .12s';
  w.style.transform = 'rotate(-5deg) scale(1.05)';
  setTimeout(() => w.style.transform = 'rotate(4deg)', 120);
  setTimeout(() => w.style.transform = 'none', 240);
  setTimeout(() => $('flap').classList.add('open'), 350);
  setTimeout(() => $('s3').style.opacity = 0, 1000);
  setTimeout(() => show('s4'), 1500);
};

$('flip').onclick = () => { $('s4').style.opacity = 0; setTimeout(() => show('s5'), 400); };

// спасибо
$('thx').onclick = () => {
  const c = ['💋','😘','❤️','😍','😊','😻','💕','💗'];
  for (let i = 0; i < 30; i++) setTimeout(() => {
    const e = document.createElement('span'); e.className = 'conf';
    e.textContent = c[Math.random() * c.length | 0];
    e.style.left = Math.random() * 95 + 'vw'; document.body.appendChild(e);
    setTimeout(() => e.remove(), 1900);
  }, i * 60);
  $('thx').textContent = 'Thank you! 💛';
};
